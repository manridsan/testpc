name: Build and Deploy Docker

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/python-app:latest .

    - name: Push Image
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/python-app:latest

    - name: Deploy to Server
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |

          docker pull ${{ secrets.DOCKER_USERNAME }}/python-app:latest

          docker stop python-app || true

          docker rm python-app || true

          docker run -d \
            --name python-app \
            -p 5000:5000 \
            --restart unless-stopped \
            ${{ secrets.DOCKER_USERNAME }}/python-app:latest
